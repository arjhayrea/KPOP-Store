<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>K-POP HAVEN</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="navbar">

        <div class="logo">
            K-POP <span>HAVEN</span>
        </div>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search K-pop products..."
            >

            <button onclick="searchProducts()">
                🔍
            </button>

        </div>

        <button class="cart-button">
            🛒 Cart
            <span id="cartCount">0</span>
        </button>

    </div>

</header>


<section class="hero">

    <div class="hero-content">

        <h1>
            Your K-pop collection
            starts here 💜
        </h1>

        <p>
            Albums, light sticks, photocards
            and K-pop merchandise.
        </p>

    </div>

</section>


<main>

    <div class="catalog-header">

        <h2>K-pop Products</h2>

        <span id="productCount">
            0 products
        </span>

    </div>


    <div class="categories">

        <button
            class="category active"
            onclick="filterCategory('All', this)">
            All
        </button>

        <button
            class="category"
            onclick="filterCategory('Albums', this)">
            Albums
        </button>

        <button
            class="category"
            onclick="filterCategory('Light Sticks', this)">
            Light Sticks
        </button>

        <button
            class="category"
            onclick="filterCategory('Merch', this)">
            Merch
        </button>

        <button
            class="category"
            onclick="filterCategory('Photocards', this)">
            Photocards
        </button>

    </div>


    <div
        id="productGrid"
        class="product-grid">
    </div>

</main>


<footer>

    <p>
        © 2026 K-POP HAVEN
    </p>

</footer>


<script src="js/products.js"></script>

</body>

</html>
